name: Bug report
description: Create a report to help us improve
title: "[BUG] "
labels: []
assignees: []
body:

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform has the issue been observed on? Select all that apply.
      multiple: true
      options:
        - Web
        - Windows
        - Android        
        - Tracking (ATrack)
    validations:
      required: true

  - type: dropdown
    id: Installation Type
    attributes:
      label: Platform
      description: Which installation type has the issue been observed on? Select all that apply.
      multiple: true
      options:
        - WizeFloor (Ceiling)
        - WizeFloor Go
        - WizeFloor Ultra
        - WizeWall
    validations:
      required: true
      
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: Which game(s) template does the issue occur on? Select all that apply.
      multiple: true
      options:
        - Balloons
        - Bubbles
        - Bomb the Pirate
        - Categories
        - Dungeon Jump
        - Fishing
        - Fish Pond
        - Floor Keyboard
        - Flowers
        - Football
        - Geometrix
        - Image Chaser
        - Jewel Packer
        - Memory
        - Menu
        - Music Box
        - Obstacle Race
        - Paper Lines
        - Piano
        - Poll
        - Pong
        - Puzzle
        - Quiz
        - RoboTrax
        - Rubber Ducks
        - Scratch
        - Sensory Path
        - Slides
        - Stepstone
        - Storyteller
        - Theme Cards
        - The Three Billy Goats Gruff
        - Trails

  - type: textarea
    id: describe_bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. 
        2. 
    validations:
      required: true

  - type: input
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: Describe what you expected to happen.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
